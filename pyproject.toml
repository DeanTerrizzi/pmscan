[project]
name = "pmscan"
version = "0.1.0"
description = "Scan every Polymarket market for arbitrage and high-probability yield opportunities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
trade = ["polymarket-client>=0.20", "polymarket-us>=2.4"]  # live order placement (pmscan watch/serve --trade --live)

[project.scripts]
pmscan = "pmscan.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pmscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
